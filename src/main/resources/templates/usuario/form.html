<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${usuario.id == null} ? 'Nuevo Usuario' : 'Editar Usuario'">Formulario Usuario</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div class="container mt-4">
        <h1 th:text="${usuario.id == null} ? 'Nuevo Usuario' : 'Editar Usuario'">Formulario</h1>

        <form th:action="${usuario.id == null} ? @{/usuarios/guardar} : @{/usuarios/actualizar/{id}(id=${usuario.id})}"
              method="post" class="mt-3">

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" th:value="${usuario.username}"
                       class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    <span th:text="${usuario.id == null} ? 'Contraseña' : 'Nueva Contraseña (dejar vacío para mantener la actual)'">Contraseña</span>
                </label>
                <input type="password" id="password" name="password" class="form-control"
                       th:required="${usuario.id == null}">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" th:value="${usuario.email}" class="form-control">
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" id="enabled" name="enabled" value="true" class="form-check-input"
                       th:checked="${usuario.enabled}">
                <label for="enabled" class="form-check-label">Activo</label>
            </div>

            <div class="mb-3">
                <label class="form-label">Roles</label>
                <div th:each="rol : ${todosRoles}" class="form-check">
                    <input type="checkbox" class="form-check-input" th:id="'rol-' + ${rol.id}"
                           name="roles" th:value="${rol.id}"
                           th:checked="${usuario.roles != null and usuario.roles.contains(rol)}">
                    <label class="form-check-label" th:for="'rol-' + ${rol.id}" th:text="${rol.nombre}">ROLE</label>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success" th:text="${usuario.id == null} ? 'Crear' : 'Actualizar'">Guardar</button>
                <a class="btn btn-secondary" th:href="@{/usuarios}">Cancelar</a>
            </div>
        </form>
    </div>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
