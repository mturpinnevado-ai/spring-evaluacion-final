<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud Incorrecta - Evaluación Final</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div class="container mt-5 text-center">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h1 class="display-1 text-warning">400</h1>
                <h2 class="mb-3">Solicitud Incorrecta</h2>
                <p class="lead text-muted" th:text="${error} ?: 'La solicitud no pudo ser procesada debido a un error de sintaxis.'">Error</p>
                <p th:if="${message}" class="text-muted" th:text="${message}"></p>
                <a class="btn btn-primary mt-3" th:href="@{/}">Volver al inicio</a>
            </div>
        </div>
    </div>
</body>
</html>
