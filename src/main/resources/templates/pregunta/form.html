<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pregunta.id == null} ? 'Nueva Pregunta' : 'Editar Pregunta'">Formulario Pregunta</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div class="container mt-4">
        <h1 th:text="${pregunta.id == null} ? 'Nueva Pregunta' : 'Editar Pregunta'">Formulario</h1>

        <form th:action="${pregunta.id == null} ? @{/preguntas/guardar} : @{/preguntas/actualizar/{id}(id=${pregunta.id})}"
              th:object="${pregunta}" method="post" class="mt-3">

            <input type="hidden" name="tipo" th:value="${pregunta.id == null} ? 'ABIERTA' : ${pregunta.tipo}">

            <div class="mb-3" th:if="${pregunta.id == null}">
                <label for="tipo-select" class="form-label">Tipo de Pregunta</label>
                <select id="tipo-select" class="form-select" onchange="actualizarTipo(this.value)">
                    <option value="ABIERTA" th:selected="${pregunta.tipo == 'ABIERTA'}">Abierta</option>
                    <option value="V_F" th:selected="${pregunta.tipo == 'V_F'}">Verdadero/Falso</option>
                    <option value="UNICA" th:selected="${pregunta.tipo == 'UNICA'}">Selección Única</option>
                    <option value="MULTIPLE" th:selected="${pregunta.tipo == 'MULTIPLE'}">Selección Múltiple</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="enunciado" class="form-label">Enunciado</label>
                <input type="text" id="enunciado" th:field="*{enunciado}"
                       class="form-control" th:classappend="${#fields.hasErrors('enunciado')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('enunciado')}" th:errors="*{enunciado}">Error</div>
            </div>

            <div id="seccion-ABIERTA" class="seccion-tipo" th:classappend="${pregunta.tipo == 'ABIERTA' or pregunta.id == null} ? '' : 'd-none'">
                <div class="mb-3">
                    <label for="respuesta" class="form-label">Respuesta</label>
                    <input type="text" id="respuesta" th:field="*{respuesta}"
                           class="form-control" th:classappend="${#fields.hasErrors('respuesta')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('respuesta')}" th:errors="*{respuesta}">Error</div>
                </div>
            </div>

            <div id="seccion-V_F" class="seccion-tipo" th:classappend="${pregunta.tipo == 'V_F'} ? '' : 'd-none'">
                <div class="mb-3 form-check">
                    <input type="checkbox" id="esVerdadero" name="esVerdadero" value="true" class="form-check-input"
                           th:checked="${pregunta.tipo == 'V_F' and pregunta.esVerdadero}">
                    <label for="esVerdadero" class="form-check-label">Verdadero</label>
                </div>
            </div>

            <div id="seccion-UNICA" class="seccion-tipo" th:classappend="${pregunta.tipo == 'UNICA'} ? '' : 'd-none'">
                <div class="mb-3">
                    <label for="opciones" class="form-label">Opciones (separadas por |)</label>
                    <input type="text" id="opciones" name="opciones" th:value="${pregunta.tipo == 'UNICA' ? pregunta.opciones : ''}"
                           class="form-control">
                </div>
                <div class="mb-3">
                    <label for="opcionCorrecta" class="form-label">Opción Correcta</label>
                    <input type="text" id="opcionCorrecta" name="opcionCorrecta" th:value="${pregunta.tipo == 'UNICA' ? pregunta.opcionCorrecta : ''}"
                           class="form-control">
                </div>
            </div>

            <div id="seccion-MULTIPLE" class="seccion-tipo" th:classappend="${pregunta.tipo == 'MULTIPLE'} ? '' : 'd-none'">
                <div class="mb-3">
                    <label for="opcionesMult" class="form-label">Opciones (separadas por |)</label>
                    <input type="text" id="opcionesMult" name="opciones" th:value="${pregunta.tipo == 'MULTIPLE' ? pregunta.opciones : ''}"
                           class="form-control">
                </div>
                <div class="mb-3">
                    <label for="opcionesCorrectas" class="form-label">Opciones Correctas (separadas por ,)</label>
                    <input type="text" id="opcionesCorrectas" name="opcionesCorrectas" th:value="${pregunta.tipo == 'MULTIPLE' ? pregunta.opcionesCorrectas : ''}"
                           class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label for="tematica" class="form-label">Temática</label>
                <select id="tematica" th:field="*{tematica}"
                        class="form-select" th:classappend="${#fields.hasErrors('tematica')} ? 'is-invalid'">
                    <option value="">Seleccione una temática</option>
                    <option th:each="t : ${tematicas}" th:value="${t.id}" th:text="${t.nombre}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('tematica')}" th:errors="*{tematica}">Error</div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success" th:text="${pregunta.id == null} ? 'Crear' : 'Actualizar'">Guardar</button>
                <a class="btn btn-secondary" th:href="@{/preguntas}">Cancelar</a>
            </div>
        </form>
    </div>
    <script>
        function actualizarTipo(tipo) {
            document.querySelectorAll('.seccion-tipo').forEach(function(el) {
                el.classList.add('d-none');
                el.querySelectorAll('input, select, textarea').forEach(function(input) {
                    input.disabled = true;
                });
            });
            var seccion = document.getElementById('seccion-' + tipo);
            if (seccion) {
                seccion.classList.remove('d-none');
                seccion.querySelectorAll('input, select, textarea').forEach(function(input) {
                    input.disabled = false;
                });
            }
            document.querySelector('input[name="tipo"]').value = tipo;
        }
    </script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
