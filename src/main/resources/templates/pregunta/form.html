<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pregunta.id == null} ? 'Nueva Pregunta' : 'Editar Pregunta'">Formulario Pregunta</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div class="container mt-4">
        <h1 th:text="${pregunta.id == null} ? 'Nueva Pregunta' : 'Editar Pregunta'">Formulario</h1>

        <form th:action="${pregunta.id == null} ? @{/preguntas/guardar} : @{/preguntas/actualizar/{id}(id=${pregunta.id})}"
              th:object="${pregunta}" method="post" class="mt-3">

            <div class="mb-3">
                <label for="enunciado" class="form-label">Enunciado</label>
                <input type="text" id="enunciado" th:field="*{enunciado}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="respuesta" class="form-label">Respuesta</label>
                <input type="text" id="respuesta" th:field="*{respuesta}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="tematica" class="form-label">Temática</label>
                <select id="tematica" th:field="*{tematica}" class="form-select" required>
                    <option value="">Seleccione una temática</option>
                    <option th:each="t : ${tematicas}" th:value="${t.id}" th:text="${t.nombre}"></option>
                </select>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success" th:text="${pregunta.id == null} ? 'Crear' : 'Actualizar'">Guardar</button>
                <a class="btn btn-secondary" th:href="@{/preguntas}">Cancelar</a>
            </div>
        </form>
    </div>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
